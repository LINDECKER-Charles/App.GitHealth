<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760"
  role="img" aria-labelledby="title description">
  <title id="title">GitHealth — the Git facts before the decision</title>
  <desc id="description">
    A brass Git branch runs through a local, explainable diagnostic bench.
  </desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111010" />
      <stop offset="1" stop-color="#211f1b" />
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e9ce95" />
      <stop offset="1" stop-color="#c2933a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000"
        flood-opacity="0.35" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3c3831" stroke-opacity="0.8" />
    </pattern>
  </defs>

  <rect width="1600" height="760" rx="28" fill="url(#canvas)" />
  <rect x="1" y="1" width="1598" height="758" rx="27" fill="none" stroke="#3c3831" />
  <path d="M0 600C370 520 600 700 960 620S1320 470 1600 550V760H0Z"
    fill="#1a1815" fill-opacity="0.78" />

  <g font-family="IBM Plex Sans, Arial, sans-serif">
    <g transform="translate(86 76)">
      <rect width="46" height="46" rx="10" fill="#2c2925" stroke="#6b4c19" />
      <path d="M15 11V35M15 23C15 27 30 23 30 31" fill="none" stroke="#d9b25f"
        stroke-width="3.5" stroke-linecap="round" />
      <circle cx="15" cy="10" r="4" fill="#111010" stroke="#d9b25f" stroke-width="3" />
      <circle cx="15" cy="36" r="4" fill="#111010" stroke="#d9b25f" stroke-width="3" />
      <circle cx="31" cy="32" r="4" fill="#111010" stroke="#d9b25f" stroke-width="3" />
      <path d="M13 23H18L21 18L25 29L29 23H32" fill="none" stroke="#6b82e8"
        stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      <text x="64" y="19" fill="#a39d93" font-size="13" font-weight="600"
        letter-spacing="2.2">LOCAL CASE FILE · GH-001</text>
      <text x="64" y="42" fill="#fcfbf9" font-size="17" font-weight="600">GitHealth</text>
    </g>

    <text x="86" y="222" fill="#fcfbf9" font-size="68" font-weight="650"
      letter-spacing="-2.4">The Git facts</text>
    <text x="86" y="298" fill="#fcfbf9" font-size="68" font-weight="650"
      letter-spacing="-2.4">before the decision.</text>
    <text x="89" y="352" fill="#c4bfb6" font-size="23" font-weight="400">
      Readable, explainable diagnosis of your branches.
    </text>

    <g transform="translate(86 408)" font-family="IBM Plex Mono, monospace"
      font-size="13" font-weight="600">
      <g>
        <rect width="134" height="38" rx="19" fill="#211f1b" stroke="#4e4a43" />
        <circle cx="19" cy="19" r="4" fill="#1e9a5c" />
        <text x="32" y="24" fill="#c4bfb6">ZERO CLONE</text>
      </g>
      <g transform="translate(146)">
        <rect width="132" height="38" rx="19" fill="#211f1b" stroke="#4e4a43" />
        <circle cx="19" cy="19" r="4" fill="#1e9a5c" />
        <text x="32" y="24" fill="#c4bfb6">ZERO FETCH</text>
      </g>
      <g transform="translate(290)">
        <rect width="142" height="38" rx="19" fill="#211f1b" stroke="#4e4a43" />
        <circle cx="19" cy="19" r="4" fill="#1e9a5c" />
        <text x="32" y="24" fill="#c4bfb6">ZERO WRITES</text>
      </g>
      <g transform="translate(444)">
        <rect width="165" height="38" rx="19" fill="#211f1b" stroke="#4e4a43" />
        <circle cx="19" cy="19" r="4" fill="#1e9a5c" />
        <text x="32" y="24" fill="#c4bfb6">ZERO TELEMETRY</text>
      </g>
    </g>

    <g transform="translate(86 520)">
      <text y="16" fill="#847e74" font-family="IBM Plex Mono, monospace" font-size="12"
        letter-spacing="1.5">READ · EXPLAIN · DECIDE</text>
      <path d="M0 42H610" stroke="#3c3831" />
      <text y="76" fill="#a39d93" font-size="15">Windows · macOS · Docker</text>
      <text x="440" y="76" fill="#847e74" font-family="IBM Plex Mono, monospace"
        font-size="13">0.1.0</text>
    </g>

    <g transform="translate(790 54)" filter="url(#shadow)">
      <rect width="738" height="652" rx="20" fill="#0a0909" />
      <rect x="1" y="1" width="736" height="650" rx="19" fill="none" stroke="#4e4a43" />
      <rect x="32" y="32" width="674" height="588" rx="14" fill="url(#grid)" />
      <text x="58" y="70" fill="#a39d93" font-family="IBM Plex Mono, monospace"
        font-size="12" letter-spacing="1.5">ANATOMY OF THE VERDICT / ORIGIN·MAIN</text>
      <text x="598" y="70" fill="#93cfae" font-family="IBM Plex Mono, monospace"
        font-size="12">● LOCAL</text>

      <path d="M190 128V536" stroke="url(#brass)" stroke-width="6"
        stroke-linecap="round" />
      <path d="M190 222C190 260 280 236 280 286V330C280 380 190 354 190 396"
        fill="none" stroke="#c2933a" stroke-width="5" stroke-linecap="round" />
      <path d="M190 308C190 340 368 312 368 372V452" fill="none" stroke="#8a6420"
        stroke-width="5" stroke-linecap="round" />
      <path d="M190 158C190 188 458 156 458 216V244" fill="none" stroke="#d9b25f"
        stroke-width="5" stroke-linecap="round" />

      <g fill="#0a0909" stroke="#d9b25f" stroke-width="5">
        <circle cx="190" cy="128" r="10" />
        <circle cx="190" cy="536" r="10" />
        <circle cx="280" cy="286" r="10" />
        <circle cx="368" cy="452" r="10" />
        <circle cx="458" cy="216" r="10" />
      </g>
      <path d="M170 307H181L188 291L199 326L208 307H222" fill="none" stroke="#6b82e8"
        stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

      <g transform="translate(494 142)">
        <rect width="182" height="92" rx="10" fill="#1a1815" stroke="#4e4a43" />
        <text x="16" y="25" fill="#a39d93" font-family="IBM Plex Mono, monospace"
          font-size="11">FEATURE/AUTH</text>
        <text x="16" y="52" fill="#fcfbf9" font-size="22" font-weight="600">+12 / −2</text>
        <text x="16" y="75" fill="#f3c37c" font-size="12" font-weight="600">REVIEW</text>
      </g>
      <g transform="translate(404 330)">
        <rect width="214" height="92" rx="10" fill="#1a1815" stroke="#4e4a43" />
        <text x="16" y="25" fill="#a39d93" font-family="IBM Plex Mono, monospace"
          font-size="11">RELEASE/1.0</text>
        <text x="16" y="52" fill="#fcfbf9" font-size="22" font-weight="600">0 / 0</text>
        <text x="16" y="75" fill="#93cfae" font-size="12" font-weight="600">DONE</text>
      </g>
      <g transform="translate(56 548)">
        <rect width="620" height="44" rx="9" fill="#111010" stroke="#3c3831" />
        <circle cx="22" cy="22" r="4" fill="#1e9a5c" />
        <text x="36" y="27" fill="#c4bfb6" font-family="IBM Plex Mono, monospace"
          font-size="12">4 BRANCHES READ · NO GIT WRITES · READY</text>
      </g>
    </g>
  </g>
</svg>
