version: 2

# The updates target `dev`: it is the integration branch, `main` only receives
# promotions. Accepted consequence: `target-branch` disables Dependabot's automatic
# *security updates* (the *alerts* stay active), so security fixes go through the
# weekly version updates or through a manual trigger.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /src/App.GitHealth.Web
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular/*"
      npm-development:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /tests/App.GitHealth.E2E
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      end-to-end:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
