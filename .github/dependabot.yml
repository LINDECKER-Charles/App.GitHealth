version: 2

# Les mises à jour ciblent `dev` : c'est la branche d'intégration, `main` ne
# reçoit que des promotions. Conséquence assumée : `target-branch` désactive les
# *security updates* automatiques de Dependabot (les *alertes* restent actives),
# les correctifs de sécurité passent donc par les mises à jour de version
# hebdomadaires ou par un déclenchement manuel.
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      dotnet:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /src/App.GitHealth.Web
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      angular:
        patterns:
          - "@angular/*"
      npm-development:
        dependency-type: development
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /tests/App.GitHealth.E2E
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      end-to-end:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
