name: Release

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.runtime }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime: win-x64
          - runner: macos-15-intel
            runtime: osx-x64
          - runner: macos-15
            runtime: osx-arm64
          - runner: ubuntu-latest
            runtime: linux-x64

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/App.GitHealth.Web/package-lock.json

      # Each phase carries its own timeout. A timeout at the job level cancels
      # everything without the runner reporting its logs — the trace is then lost —
      # whereas a step timeout fails cleanly and lets the collection that follows
      # run. The phases are split to locate a hang: --blame-hang only arms once the
      # test host has started, and so stays silent if the freeze happens during the
      # restore or the build.
      - name: Restore the Git integration tests
        timeout-minutes: 6
        run: >-
          dotnet restore
          tests/App.GitHealth.Git.IntegrationTests/App.GitHealth.Git.IntegrationTests.csproj

      - name: Build the Git integration tests
        timeout-minutes: 8
        run: >-
          dotnet build
          tests/App.GitHealth.Git.IntegrationTests/App.GitHealth.Git.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Test the Git fixtures on the platform
        timeout-minutes: 10
        run: >-
          dotnet test
          tests/App.GitHealth.Git.IntegrationTests/App.GitHealth.Git.IntegrationTests.csproj
          --configuration Release
          --no-build
          --blame-hang
          --blame-hang-timeout 3m
          --blame-hang-dump-type none

      - name: Keep the hung test trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: blame-${{ matrix.runtime }}
          path: tests/App.GitHealth.Git.IntegrationTests/TestResults
          if-no-files-found: ignore

      - name: Publish the standalone artefact
        shell: pwsh
        run: ./eng/Publish-Native.ps1 -RuntimeIdentifier ${{ matrix.runtime }}

      - name: Run the native smoke test
        shell: pwsh
        run: >-
          ./tests/Infrastructure/Invoke-NativeSmokeTest.ps1
          -PublishDirectory artifacts/publish/${{ matrix.runtime }}

      - name: Generate the SBOM
        uses: anchore/sbom-action@v0.24.1
        with:
          path: artifacts/publish/${{ matrix.runtime }}
          format: spdx-json
          artifact-name: githealth-${{ matrix.runtime }}.spdx.json
          output-file: artifacts/publish/githealth-${{ matrix.runtime }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Produce the SHA-256 checksum
        id: release-files
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/publish -File |
            Where-Object Name -Match '^githealth-${{ matrix.runtime }}\.(zip|tar\.gz)$' |
            Select-Object -First 1
          if ($null -eq $archive) {
            throw "Archive ${{ matrix.runtime }} not found."
          }
          $checksum = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash
          $checksumPath = "$($archive.FullName).sha256"
          "$($checksum.ToLowerInvariant()) *$($archive.Name)" |
            Set-Content -LiteralPath $checksumPath -Encoding utf8NoBOM
          "archive=$($archive.FullName)" >> $env:GITHUB_OUTPUT

      - name: Produce the Velopack installer
        if: matrix.runtime != 'linux-x64' && github.event_name == 'release'
        shell: pwsh
        run: >-
          ./eng/New-VelopackRelease.ps1
          -PublishDirectory artifacts/publish/${{ matrix.runtime }}
          -Version '${{ github.event.release.tag_name }}'
          -RuntimeIdentifier ${{ matrix.runtime }}
          -ReleaseDirectory artifacts/publish

      - name: Produce the winget manifests
        if: matrix.runtime == 'win-x64' && github.event_name == 'release'
        shell: pwsh
        run: >-
          ./eng/New-WingetManifest.ps1
          -InstallerPath artifacts/publish/App.GitHealth-win-x64-Setup.exe
          -Version '${{ github.event.release.tag_name }}'
          -OutputDirectory artifacts/publish

      - name: Produce the Scoop manifest
        if: matrix.runtime == 'win-x64' && github.event_name == 'release'
        shell: pwsh
        run: >-
          ./eng/New-ScoopManifest.ps1
          -ArchivePath '${{ steps.release-files.outputs.archive }}'
          -Version '${{ github.event.release.tag_name }}'

      - name: Attest the provenance
        if: >-
          github.event_name == 'release' &&
          (github.event.repository.visibility == 'public' ||
          vars.ENABLE_GITHUB_ATTESTATIONS == 'true')
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.release-files.outputs.archive }}

      - name: Attest the SBOM
        if: >-
          github.event_name == 'release' &&
          (github.event.repository.visibility == 'public' ||
          vars.ENABLE_GITHUB_ATTESTATIONS == 'true')
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.release-files.outputs.archive }}
          sbom-path: >-
            artifacts/publish/githealth-${{ matrix.runtime }}.spdx.json

      - name: Upload the artefact
        uses: actions/upload-artifact@v7
        with:
          name: githealth-${{ matrix.runtime }}
          path: |
            artifacts/publish/githealth-${{ matrix.runtime }}.*
            artifacts/publish/githealth.json
            artifacts/publish/App.GitHealth-*
            artifacts/publish/releases.*.json
            artifacts/publish/LINDECKER-Charles.GitHealth*.yaml
          if-no-files-found: error

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Run the Docker smoke test
        shell: pwsh
        run: ./tests/Infrastructure/Invoke-DockerSmokeTest.ps1

  publish-release:
    name: Attach the artefacts to the release
    if: github.event_name == 'release'
    needs:
      - native
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the artefacts
        uses: actions/download-artifact@v8
        with:
          pattern: githealth-*
          path: artifacts/release
          merge-multiple: true

      - name: Attach the artefacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
