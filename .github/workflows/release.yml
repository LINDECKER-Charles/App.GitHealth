name: Publication

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.runtime }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            runtime: win-x64
          - runner: macos-15-intel
            runtime: osx-x64
          - runner: macos-15
            runtime: osx-arm64
          - runner: ubuntu-latest
            runtime: linux-x64

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/App.GitHealth.Web/package-lock.json

      # Chaque phase porte son propre délai. Un dépassement au niveau du job annule
      # tout sans que le runner remonte ses journaux — la trace est alors perdue —
      # alors qu'un dépassement d'étape échoue proprement et laisse tourner la
      # collecte qui suit. Les phases sont séparées pour situer un blocage :
      # --blame-hang ne s'arme qu'une fois l'hôte de test démarré, et reste donc
      # muet si le figeage se produit pendant la restauration ou la compilation.
      - name: Restaurer les tests d'intégration Git
        timeout-minutes: 6
        run: >-
          dotnet restore
          tests/App.GitHealth.Git.IntegrationTests/App.GitHealth.Git.IntegrationTests.csproj

      - name: Compiler les tests d'intégration Git
        timeout-minutes: 8
        run: >-
          dotnet build
          tests/App.GitHealth.Git.IntegrationTests/App.GitHealth.Git.IntegrationTests.csproj
          --configuration Release
          --no-restore

      - name: Tester les fixtures Git sur la plateforme
        timeout-minutes: 10
        run: >-
          dotnet test
          tests/App.GitHealth.Git.IntegrationTests/App.GitHealth.Git.IntegrationTests.csproj
          --configuration Release
          --no-build
          --blame-hang
          --blame-hang-timeout 3m
          --blame-hang-dump-type none

      - name: Conserver la trace du test figé
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: blame-${{ matrix.runtime }}
          path: tests/App.GitHealth.Git.IntegrationTests/TestResults
          if-no-files-found: ignore

      - name: Publier l’artefact autonome
        shell: pwsh
        run: ./eng/Publish-Native.ps1 -RuntimeIdentifier ${{ matrix.runtime }}

      - name: Exécuter le smoke test natif
        shell: pwsh
        run: >-
          ./tests/Infrastructure/Invoke-NativeSmokeTest.ps1
          -PublishDirectory artifacts/publish/${{ matrix.runtime }}

      - name: Générer le SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: artifacts/publish/${{ matrix.runtime }}
          format: spdx-json
          artifact-name: githealth-${{ matrix.runtime }}.spdx.json
          output-file: artifacts/publish/githealth-${{ matrix.runtime }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Produire la somme SHA-256
        id: release-files
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/publish -File |
            Where-Object Name -Match '^githealth-${{ matrix.runtime }}\.(zip|tar\.gz)$' |
            Select-Object -First 1
          if ($null -eq $archive) {
            throw "Archive ${{ matrix.runtime }} introuvable."
          }
          $checksum = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash
          $checksumPath = "$($archive.FullName).sha256"
          "$($checksum.ToLowerInvariant()) *$($archive.Name)" |
            Set-Content -LiteralPath $checksumPath -Encoding utf8NoBOM
          "archive=$($archive.FullName)" >> $env:GITHUB_OUTPUT

      - name: Produire l’installeur Velopack
        if: matrix.runtime != 'linux-x64' && github.event_name == 'release'
        shell: pwsh
        run: >-
          ./eng/New-VelopackRelease.ps1
          -PublishDirectory artifacts/publish/${{ matrix.runtime }}
          -Version '${{ github.event.release.tag_name }}'
          -RuntimeIdentifier ${{ matrix.runtime }}
          -ReleaseDirectory artifacts/publish

      - name: Produire les manifestes winget
        if: matrix.runtime == 'win-x64' && github.event_name == 'release'
        shell: pwsh
        run: >-
          ./eng/New-WingetManifest.ps1
          -InstallerPath artifacts/publish/App.GitHealth-win-x64-Setup.exe
          -Version '${{ github.event.release.tag_name }}'
          -OutputDirectory artifacts/publish

      - name: Produire le manifeste Scoop
        if: matrix.runtime == 'win-x64' && github.event_name == 'release'
        shell: pwsh
        run: >-
          ./eng/New-ScoopManifest.ps1
          -ArchivePath '${{ steps.release-files.outputs.archive }}'
          -Version '${{ github.event.release.tag_name }}'

      - name: Attester la provenance
        if: >-
          github.event_name == 'release' &&
          (github.event.repository.visibility == 'public' ||
          vars.ENABLE_GITHUB_ATTESTATIONS == 'true')
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.release-files.outputs.archive }}

      - name: Attester le SBOM
        if: >-
          github.event_name == 'release' &&
          (github.event.repository.visibility == 'public' ||
          vars.ENABLE_GITHUB_ATTESTATIONS == 'true')
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.release-files.outputs.archive }}
          sbom-path: >-
            artifacts/publish/githealth-${{ matrix.runtime }}.spdx.json

      - name: Charger l’artefact
        uses: actions/upload-artifact@v7
        with:
          name: githealth-${{ matrix.runtime }}
          path: |
            artifacts/publish/githealth-${{ matrix.runtime }}.*
            artifacts/publish/githealth.json
            artifacts/publish/App.GitHealth-*
            artifacts/publish/releases.*.json
            artifacts/publish/LINDECKER-Charles.GitHealth*.yaml
          if-no-files-found: error

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Exécuter le smoke test Docker
        shell: pwsh
        run: ./tests/Infrastructure/Invoke-DockerSmokeTest.ps1

  publish-release:
    name: Attacher les artefacts à la release
    if: github.event_name == 'release'
    needs:
      - native
      - docker
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Télécharger les artefacts
        uses: actions/download-artifact@v8
        with:
          pattern: githealth-*
          path: artifacts/release
          merge-multiple: true

      - name: Attacher les artefacts à la release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/release/* --clobber
