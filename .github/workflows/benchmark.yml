name: Benchmark

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "src/App.GitHealth.Api/**"
      - "src/App.GitHealth.Core/**"
      - "Directory.Build.props"
      - "global.json"
      - "App.GitHealth.sln"
      - ".github/workflows/benchmark.yml"
  push:
    branches:
      - main
    paths:
      - "benchmarks/**"
      - "src/App.GitHealth.Api/**"
      - "src/App.GitHealth.Core/**"
      - "Directory.Build.props"
      - "global.json"
      - "App.GitHealth.sln"
      - ".github/workflows/benchmark.yml"
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:
    inputs:
      enforce_budgets:
        description: Fail if the reference runner budgets are exceeded
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Measure 100, 500 and 1,000 branches
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ENFORCE_BENCHMARK_BUDGETS: ${{ inputs.enforce_budgets || false }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run the baseline
        run: |
          $budgetArguments = @()
          if ($env:ENFORCE_BENCHMARK_BUDGETS -eq "true") {
            $budgetArguments += "--enforce-budgets"
          }
          dotnet run `
            --project benchmarks/App.GitHealth.Benchmarks/App.GitHealth.Benchmarks.csproj `
            --configuration Release `
            -- `
            --sizes 100,500,1000 `
            --warmup 1 `
            --iterations 3 `
            --output artifacts/benchmarks/latest.json `
            @budgetArguments

      - name: Keep the measurements
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-windows
          path: artifacts/benchmarks/latest.json
          if-no-files-found: error
