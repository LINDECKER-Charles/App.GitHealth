name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifier le socle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/App.GitHealth.Web/package-lock.json

      - name: Restaurer .NET
        run: dotnet restore App.GitHealth.sln

      - name: Installer Angular
        run: npm ci --prefix src/App.GitHealth.Web

      - name: Compiler .NET
        run: dotnet build App.GitHealth.sln --configuration Release --no-restore

      - name: Tester Angular
        run: npm run test:ci --prefix src/App.GitHealth.Web

      - name: Tester .NET
        run: >-
          dotnet test App.GitHealth.sln
          --configuration Release
          --no-build
          --no-restore

      - name: Publier l’application intégrée
        run: >-
          dotnet publish src/App.GitHealth.Api/App.GitHealth.Api.csproj
          --configuration Release
          --output artifacts/publish
          --no-build
          --no-restore

      - name: Vérifier le bundle publié
        run: test -f artifacts/publish/wwwroot/index.html

      - name: Vérifier Docker Compose
        shell: pwsh
        run: ./tests/Infrastructure/Assert-ComposeConfiguration.ps1

      - name: Analyser le Dockerfile
        run: docker buildx build --check .
