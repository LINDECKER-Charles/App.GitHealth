name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the baseline
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            src/App.GitHealth.Web/package-lock.json
            tests/App.GitHealth.E2E/package-lock.json

      - name: Restore .NET
        run: dotnet restore App.GitHealth.sln

      - name: Install Angular
        run: npm ci --prefix src/App.GitHealth.Web

      - name: Install the end-to-end tests
        run: npm ci --prefix tests/App.GitHealth.E2E

      - name: Check the .NET formatting
        run: dotnet format App.GitHealth.sln --verify-no-changes --no-restore

      - name: Check the Angular formatting
        run: npm run format:check --prefix src/App.GitHealth.Web

      - name: Check the Playwright types
        run: npm run typecheck --prefix tests/App.GitHealth.E2E

      - name: Check the Playwright formatting
        run: npm run format:check --prefix tests/App.GitHealth.E2E

      - name: Build .NET
        run: dotnet build App.GitHealth.sln --configuration Release --no-restore

      - name: Test Angular
        run: npm run test:ci --prefix src/App.GitHealth.Web

      - name: Verify the message catalog
        run: npm run i18n:extract --prefix src/App.GitHealth.Web

      - name: Check the message catalog drift
        run: git diff --exit-code src/App.GitHealth.Web/src/locale/messages.json

      - name: Test .NET
        run: >-
          dotnet test App.GitHealth.sln
          --configuration Release
          --no-build
          --no-restore

      - name: Publish the integrated application
        run: >-
          dotnet publish src/App.GitHealth.Api/App.GitHealth.Api.csproj
          --configuration Release
          --output artifacts/publish
          --no-build
          --no-restore

      - name: Check the published bundle
        run: test -f artifacts/publish/wwwroot/index.html

      - name: Install Chromium
        working-directory: tests/App.GitHealth.E2E
        run: npx playwright install --with-deps chromium

      - name: Test the end-to-end flow
        working-directory: tests/App.GitHealth.E2E
        env:
          GITHEALTH_E2E_PUBLISH: ${{ github.workspace }}/artifacts/publish
        run: npm run test:ci

      - name: Keep the Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-playwright
          path: |
            tests/App.GitHealth.E2E/playwright-report
            tests/App.GitHealth.E2E/test-results
          if-no-files-found: ignore

      - name: Check the build targeting rules
        shell: pwsh
        run: ./tests/Infrastructure/Invoke-BuildEnvironmentTests.ps1

      - name: Check Docker Compose
        shell: pwsh
        run: ./tests/Infrastructure/Assert-ComposeConfiguration.ps1

      - name: Analyse the Dockerfile
        run: docker buildx build --check .

  promote:
    name: Promote dev to test
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      actions: write

    # Serialises the promotions without cancelling the one in progress: two pushes
    # close together on dev must move test forward in order, never in parallel.
    concurrency:
      group: promote-test

    # The job does no checkout: gh cannot infer the repository from a directory with
    # no .git, so GH_REPO names it explicitly.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      # force=false requires a strict fast-forward: the API refuses to move test if the
      # validated commit is not a direct descendant of the reference.
      - name: Move test to the validated commit
        run: >-
          gh api --method PATCH
          repos/${{ github.repository }}/git/refs/heads/test
          -f sha=${{ github.sha }}
          -F force=false

      # A push made with the GITHUB_TOKEN triggers no workflow, so the cross-platform
      # matrix has to be called explicitly on the promoted commit.
      - name: Trigger the cross-platform matrix
        run: gh workflow run release.yml --ref test
