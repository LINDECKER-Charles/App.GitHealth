name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifier le socle
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            src/App.GitHealth.Web/package-lock.json
            tests/App.GitHealth.E2E/package-lock.json

      - name: Restaurer .NET
        run: dotnet restore App.GitHealth.sln

      - name: Installer Angular
        run: npm ci --prefix src/App.GitHealth.Web

      - name: Installer les tests bout en bout
        run: npm ci --prefix tests/App.GitHealth.E2E

      - name: Vérifier le format .NET
        run: dotnet format App.GitHealth.sln --verify-no-changes --no-restore

      - name: Vérifier le format Angular
        run: npm run format:check --prefix src/App.GitHealth.Web

      - name: Vérifier les types Playwright
        run: npm run typecheck --prefix tests/App.GitHealth.E2E

      - name: Vérifier le format Playwright
        run: npm run format:check --prefix tests/App.GitHealth.E2E

      - name: Compiler .NET
        run: dotnet build App.GitHealth.sln --configuration Release --no-restore

      - name: Tester Angular
        run: npm run test:ci --prefix src/App.GitHealth.Web

      - name: Tester .NET
        run: >-
          dotnet test App.GitHealth.sln
          --configuration Release
          --no-build
          --no-restore

      - name: Publier l’application intégrée
        run: >-
          dotnet publish src/App.GitHealth.Api/App.GitHealth.Api.csproj
          --configuration Release
          --output artifacts/publish
          --no-build
          --no-restore

      - name: Vérifier le bundle publié
        run: test -f artifacts/publish/wwwroot/index.html

      - name: Installer Chromium
        working-directory: tests/App.GitHealth.E2E
        run: npx playwright install --with-deps chromium

      - name: Tester le parcours bout en bout
        working-directory: tests/App.GitHealth.E2E
        env:
          GITHEALTH_E2E_PUBLISH: ${{ github.workspace }}/artifacts/publish
        run: npm run test:ci

      - name: Conserver les traces Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-playwright
          path: |
            tests/App.GitHealth.E2E/playwright-report
            tests/App.GitHealth.E2E/test-results
          if-no-files-found: ignore

      - name: Vérifier les règles de ciblage des builds
        shell: pwsh
        run: ./tests/Infrastructure/Invoke-BuildEnvironmentTests.ps1

      - name: Vérifier Docker Compose
        shell: pwsh
        run: ./tests/Infrastructure/Assert-ComposeConfiguration.ps1

      - name: Analyser le Dockerfile
        run: docker buildx build --check .

  promote:
    name: Promouvoir dev vers test
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      actions: write

    # Sérialise les promotions sans annuler celle qui est en cours : deux poussées
    # rapprochées sur dev doivent avancer test dans l'ordre, jamais en parallèle.
    concurrency:
      group: promote-test

    # Le job ne fait pas de checkout : gh ne peut pas déduire le dépôt d'un répertoire
    # sans .git, GH_REPO le lui désigne explicitement.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      # force=false exige un fast-forward strict : l'API refuse d'avancer test si le
      # commit validé n'est pas un descendant direct de la référence.
      - name: Avancer test sur le commit validé
        run: >-
          gh api --method PATCH
          repos/${{ github.repository }}/git/refs/heads/test
          -f sha=${{ github.sha }}
          -F force=false

      # Une poussée faite avec le GITHUB_TOKEN ne déclenche aucun workflow : la matrice
      # multiplateforme doit donc être appelée explicitement sur le commit promu.
      - name: Déclencher la matrice multiplateforme
        run: gh workflow run release.yml --ref test
