name: Bug report
description: Report an incorrect, reproducible behaviour
title: 'fix: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for this report.

        **Before going further**, check the [troubleshooting guide][troubleshooting] and the
        [known limitations][limitations]: several surprising behaviours are accepted
        consequences of Git semantics, not bugs.

        **Never include** a company repository path, an internal branch name or an author
        identity. Anonymise before publishing.

        A **security vulnerability** is not reported here: use a
        [private security advisory][advisory].

        [troubleshooting]: https://github.com/LINDECKER-Charles/App.GitHealth/blob/main/docs/TROUBLESHOOTING.md
        [limitations]: https://github.com/LINDECKER-Charles/App.GitHealth/blob/main/docs/KNOWN_LIMITATIONS.md
        [advisory]: https://github.com/LINDECKER-Charles/App.GitHealth/security/advisories/new

  - type: checkboxes
    id: checks
    attributes:
      label: Preliminary checks
      options:
        - label: I have read the troubleshooting guide and the known limitations.
          required: true
        - label: I have searched the existing issues, open and closed.
          required: true
        - label: This report contains no real repository or author data.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: The problem in one or two sentences.
      placeholder: >-
        A merged branch is still classified as "Keep" although the policy announces the
        shortened scale.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The minimal steps, in order.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: >-
        Add the console messages if the application refuses to start or if an analysis
        fails. Anonymise the paths.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Execution mode
      options:
        - Native Windows x64 executable
        - Native macOS Intel executable
        - Native macOS Apple Silicon executable
        - Docker Compose
        - From source (dotnet run / ng serve)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: GitHealth version
      description: Archive name, release tag, or Docker image tag.
      placeholder: 0.1.0-rc.1
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Operating system and Git version
      description: Output of `git --version` and the operating system.
      placeholder: Windows 11 24H2, git 2.47.1
    validations:
      required: true

  - type: textarea
    id: repository
    attributes:
      label: Shape of the analysed repository
      description: >-
        The shape often matters more than the size. Standard repository, *bare* or linked
        worktree; approximate number of branches; presence of a `.mailmap`; baseline branch
        used.
      placeholder: >-
        Standard repository, ~180 branches of which 120 remote-tracking, no .mailmap,
        `main` baseline.

  - type: textarea
    id: additional
    attributes:
      label: Additional notes
      description: >-
        Screenshots, a workaround you found, or anything else useful. A minimal
        reproduction repository built with empty commits is worth more than an extract of a
        real repository.
