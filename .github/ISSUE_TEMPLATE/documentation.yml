name: Documentation
description: Report documentation that is wrong, incomplete or misleading
title: 'docs: '
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Documentation describing a behaviour the product does not have is a defect in its
        own right. Thank you for reporting it.

  - type: dropdown
    id: document
    attributes:
      label: Document concerned
      options:
        - README.md
        - docs/USER_GUIDE.md
        - docs/TROUBLESHOOTING.md
        - docs/KNOWN_LIMITATIONS.md
        - docs/DEVOPS.md
        - docs/SECURITY_MODEL.md
        - docs/BENCHMARKING.md
        - docs/ARCHITECTURE.md
        - .github/CONTRIBUTING.md
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Precise location
      description: Section heading, or a link to the line concerned.
      placeholder: '"Configuring policies", shortened scale table'
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: >-
        Incorrect information, missing step, ambiguous wording, example that does not work.
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Suggested correction
      description: If you have the right wording, write it here.
