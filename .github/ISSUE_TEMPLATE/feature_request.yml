name: Feature request
description: Suggest a change to the product
title: 'feat: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for this suggestion.

        GitHealth **observes** a repository, it never modifies it. The following requests
        are out of scope and will be closed: deleting, merging or pushing a branch, running
        `fetch` automatically, cloning a remote repository, integrating with the GitHub,
        GitLab or Azure DevOps APIs, exposing a shared instance on a network.

        The reasons behind those boundaries are documented in [ARCHITECTURE.md][archi].

        [archi]: https://github.com/LINDECKER-Charles/App.GitHealth/blob/main/docs/ARCHITECTURE.md

  - type: checkboxes
    id: checks
    attributes:
      label: Preliminary checks
      options:
        - label: I have read the product scope and this request stays within it.
          required: true
        - label: I have searched the existing suggestions, open and closed.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: >-
        Describe the situation you experienced, not the solution. What were you trying to
        do, and what blocked you?
      placeholder: >-
        On a repository with 400 branches, I cannot isolate the ones belonging to a given
        team: the pattern filter only applies to protection and exclusion.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you have in mind, and how you would use it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >-
        Workarounds you tried, including outside GitHealth, and why they are not enough.

  - type: dropdown
    id: area
    attributes:
      label: Area concerned
      options:
        - Git analysis and measurements
        - Policies and recommendations
        - Interface and navigation
        - History and exports
        - Installation, launcher, Docker
        - Other or unsure
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional notes
      description: >-
        A mockup, an example from another application, or a willingness to contribute the
        implementation.
