blank_issues_enabled: false

contact_links:
  - name: Usage question
    url: https://github.com/LINDECKER-Charles/App.GitHealth/discussions
    about: >-
      "How do I…", "why this result": ask in the discussions. Check the user guide, the
      troubleshooting guide and the known limitations first.

  - name: Report a security vulnerability
    url: https://github.com/LINDECKER-Charles/App.GitHealth/security/advisories/new
    about: >-
      Never publish a vulnerability in a public issue. Use a private security advisory —
      unintended Git write, Docker root escape, cross-origin read or data leak.

  - name: Read the documentation
    url: https://github.com/LINDECKER-Charles/App.GitHealth/blob/main/docs/USER_GUIDE.md
    about: >-
      The user guide, the troubleshooting guide and the known limitations answer most of
      the surprises tied to Git semantics.
