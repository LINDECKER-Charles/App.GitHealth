<div class="branch-page">
  <div class="branch-page-head">
    <button
      dsButton
      size="sm"
      variant="ghost"
      iconLeft="chevron-left"
      (click)="goBack()"
      i18n="@@branchDetails.back"
    >
      Back
    </button>
  </div>
  @if (snapshotId().length > 0) {
    <app-branch-card class="branch-page-card" [snapshotId]="snapshotId()" (closed)="goBack()" />
  }
</div>
